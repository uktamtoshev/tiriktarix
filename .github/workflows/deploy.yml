name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  FRONTEND_SERVICE_NAME: tirik-tarix-frontend
  BACKEND_SERVICE_NAME: tirik-tarix-backend

  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}-frontend
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}-backend


  SSH_USER: root
  SSH_PORT: 22

  FRONTEND_PORT: 10285
  BACKEND_PORT: 10286


jobs:

  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile backend
        run: |
          cd backend
          mvn clean package -Dmaven.test.skip=true --no-transfer-progress

      - name: Login GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build backend
        run: |
          docker build -t "${BACKEND_IMAGE}:latest" ./backend
          docker push "${BACKEND_IMAGE}:latest"


  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build frontend
        run: |
          docker build -t "${FRONTEND_IMAGE}:latest" ./frontend
          docker push "${FRONTEND_IMAGE}:latest"


  deploy:
    needs:
      - backend
      - frontend

    env:
     SERVER_HOST: ${{ secrets.SERVER_HOST }}

    runs-on: ubuntu-latest

    steps:
      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Login GHCR on server
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -p ${SSH_PORT} \
            ${SSH_USER}@${SERVER_HOST} \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Deploy
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -p ${SSH_PORT} \
            ${SSH_USER}@${SERVER_HOST} "

              docker pull ${BACKEND_IMAGE}:latest
              docker pull ${FRONTEND_IMAGE}:latest

              docker stop ${BACKEND_SERVICE_NAME} || true
              docker rm ${BACKEND_SERVICE_NAME} || true

              docker stop ${FRONTEND_SERVICE_NAME} || true
              docker rm ${FRONTEND_SERVICE_NAME} || true

              docker run -d \
                --name ${BACKEND_SERVICE_NAME} \
                --restart unless-stopped \
                -p ${BACKEND_PORT}:8080 \
                ${BACKEND_IMAGE}:latest

              docker run -d \
                --name ${FRONTEND_SERVICE_NAME} \
                --restart unless-stopped \
                -p ${FRONTEND_PORT}:3000 \
                ${FRONTEND_IMAGE}:latest
            "
